name: Deploy TravelVN via FTP

on:
  push:
    branches:
      - main 

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Upload the public webroot contents so index.php is at the document root
        # Note: `local-dir` must be a folder path ending with `/` per action requirements
        local-dir: public/
        # Most cPanel hosts use /public_html as document root; adjust if your host uses /htdocs
        server-dir: /public_html/
        exclude: |
          **/.git*
          **/.git*/**
          README.md
          .env